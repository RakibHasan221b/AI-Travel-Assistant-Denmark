[project]
name = "ai-denmark-explorer"
version = "0.1.0"
description = "AI-powered place discovery for Copenhagen — pilot phase of AI Denmark Explorer"
requires-python = ">=3.11"
dependencies = [
    "streamlit",
    "requests",
    "python-dotenv",
    "sqlalchemy",
    "psycopg[binary]",
    "pandas",
    "pydantic",
]

[project.optional-dependencies]
# Phase 1 — OSM bulk ingestion (osmium was installed globally during the
# original Phase 1 session and never actually declared here — a real gap,
# found while re-running ingestion to fix the landmark tag-coverage bug)
ingestion = ["osmium"]
# Phase 4 — Reddit signal pipeline
reddit = ["playwright", "flashtext", "geonamescache", "pycountry"]
# Phase 5 — ML/LLM distillation loop
distillation = ["scikit-learn"]
# Phase 6 — embeddings + pgvector semantic search
embeddings = ["sentence-transformers", "pgvector"]
# Phase 8 — RAG
# langchain-openai pinned <0.4: the latest release pulls langchain-core>=1.0,
# which conflicts with langchain 0.3.x's own langchain-core<1.0 requirement.
# langchain-groq is NOT used anywhere (grepped to confirm) — Phase 8 uses
# ChatOpenAI, Phase 11 uses crewai's own LLM class via litellm.
rag = ["langchain", "langchain-openai<0.4"]
# Phase 9 — quality-score model bake-off
modeling = ["scikit-learn", "xgboost", "optuna", "torch", "mlflow"]
# Phase 11 — agent + thin API
# crewai pulls in langchain-core>=1.0, which conflicts with the pinned
# langchain 0.3.x / langchain-openai<0.4 used elsewhere in this project.
# Install this extra in its own virtualenv (see README setup), not into an
# environment shared with other projects — a global install of crewai here
# previously broke fastapi/starlette, mcp, and streamlit compatibility for
# unrelated projects on the same machine.
# litellm: crewai's native LLM providers don't include Groq directly; Groq
# only works via litellm's "groq/<model>" fallback path.
# langchain-groq is NOT needed here — crewai 1.x's Agent.tools/llm fields are
# typed to crewai's own BaseTool/BaseLLM, not LangChain's, so Phase 11 doesn't
# use LangChain at all (see agent/tools.py's docstring).
# agent/tools.py's search_places tool does real pgvector semantic search
# (Phase 6), so this extra needs pgvector too — a real gap only surfaced when
# Render's build ran `pip install -e ".[agent]"` in isolation, unlike local
# dev/CI which always install every extra together and masked it.
# fastembed, not sentence-transformers: crewai itself doesn't need torch,
# but sentence-transformers does, and torch pushed this service's memory
# past Render's free-tier 512MB limit (deploy was getting OOM-killed).
# fastembed (ONNX Runtime — already a crewai transitive dep via chromadb)
# produces effectively identical vectors for the same all-MiniLM-L6-v2
# weights (cosine similarity 1.0000, verified before switching) — no torch
# import at all. See agent/tools.py's module docstring for the full story.
agent = ["crewai", "litellm", "fastapi", "uvicorn", "pgvector", "fastembed"]
dev = ["pytest", "ruff"]

[tool.ruff]
line-length = 100

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
# This project has no importable package of its own — every script manages
# its own sys.path for cross-imports (see e.g. pipeline/rag/generate_summaries.py)
# rather than being imported as `ai_denmark_explorer.something`. Without this,
# setuptools' automatic package discovery finds db/, app/, pipeline/, etc. as
# ambiguous top-level packages and refuses to build `pip install -e .` at all
# — which means the CI workflow's own install step would fail outright.
packages = []
